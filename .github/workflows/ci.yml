# Index CI — the published index must always match what is on disk.
#
# index.json is generated by scripts/build_index.py from the packages actually
# present in pipelines/, apps/ and community/. A stale index is the one failure
# that breaks every client at once: it advertises a package that 404s on
# install. This job regenerates it and fails if the committed copy differs.

name: CI

on:
  # Every branch, not just main. With "never commit directly to main" as the
  # rule, a main-only trigger would mean CI effectively never runs before
  # review — which is backwards: the branch is exactly where it should run.
  push:
  pull_request:
    branches: [main]

jobs:
  index:
    name: index.json is current and complete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: index.json matches the packages on disk
        run: python scripts/build_index.py --check

      - name: every indexed package exists
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          # build_index.py's actual schema (build()): one flat "packages" list,
          # each entry carrying its relative path in "hutash" — NOT split into
          # per-section "pipelines"/"apps"/"community" arrays, and NOT
          # "hutash_file". Those were the previous (pre-05a773b) field names;
          # this check was never updated after the rename, so it silently
          # iterated three always-empty lists and verified nothing.
          index = json.loads(Path("index.json").read_text(encoding="utf-8"))
          missing = []
          for entry in index.get("packages", []):
              if not Path(entry["hutash"]).is_file():
                  missing.append(f"{entry['id']} -> {entry['hutash']}")
          if missing:
              print("index references packages that do not exist:")
              print("\n".join(f"  {m}" for m in missing))
              sys.exit(1)

          counts: dict[str, int] = {}
          for entry in index.get("packages", []):
              counts[entry["type"]] = counts.get(entry["type"], 0) + 1
          print("index OK:", counts)
          if not index.get("features") or not index.get("modalities"):
              print("index is missing the features/modalities blocks Studio reads")
              sys.exit(1)
          PY
